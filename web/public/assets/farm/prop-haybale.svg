<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!-- Pocket Hatchery · Farm prop — HAY BALE  |  ANCHOR: bottom-centre (60, 90)
       Flamingo (Designer) · 2026-07-17 · Y-SORTED prop.
       Default placement: x=1180, baseY=752 (see docs/FARM-SCENE-SPEC.md). -->
  <defs>
    <radialGradient id="hayGrad" cx="0.36" cy="0.32">
      <stop offset="0"   stop-color="#F0D089"/>
      <stop offset="0.5" stop-color="#C79B4E"/>
      <stop offset="1"   stop-color="#6E5228"/>
    </radialGradient>
    <filter id="hShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <ellipse cx="60" cy="84" rx="44" ry="8" fill="#0A1A14" opacity="0.55" filter="url(#hShadow)"/>

  <!-- roll body -->
  <rect x="14" y="24" width="92" height="60" rx="12" fill="url(#hayGrad)"/>
  <!-- end cap (the spiral face, turned toward camera-left) -->
  <ellipse cx="26" cy="54" rx="13" ry="30" fill="#B98C43"/>
  <g fill="none" stroke="#8A6529" stroke-width="1.6" opacity="0.8">
    <ellipse cx="26" cy="54" rx="9"   ry="21"/>
    <ellipse cx="26" cy="54" rx="5"   ry="12"/>
    <ellipse cx="26" cy="54" rx="1.8" ry="4.5"/>
  </g>
  <!-- straw texture across the roll -->
  <g stroke="#E2C078" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <path d="M46,32 q18,4 34,1"/><path d="M44,44 q20,5 38,2"/>
    <path d="M48,58 q18,4 34,1"/><path d="M46,70 q20,5 36,2"/>
    <path d="M56,26 q14,3 26,1"/><path d="M54,78 q16,3 30,1"/>
  </g>
  <!-- twine -->
  <g stroke="#5B4020" stroke-width="1.4" opacity="0.65" fill="none">
    <path d="M60,24 v60"/><path d="M86,25 v58"/>
  </g>
  <!-- golden rim light along the top (dusk sun) -->
  <path d="M26,26 q34,-6 68,0" stroke="#FFE8A0" stroke-width="2.4" opacity="0.6" fill="none" stroke-linecap="round"/>
  <!-- loose straws for silhouette break-up -->
  <g stroke="#D9B266" stroke-width="1.2" opacity="0.7" stroke-linecap="round">
    <path d="M104,40 l7,-4"/><path d="M106,54 l8,1"/><path d="M14,44 l-7,-3"/>
    <path d="M60,22 l2,-6"/><path d="M78,23 l4,-5"/>
  </g>
</svg>
