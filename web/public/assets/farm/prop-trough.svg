<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Pocket Hatchery · Farm prop — WATER TROUGH
       Flamingo (Designer) · 2026-07-17
       ANCHOR: bottom-centre = (60, 80) in this viewBox. Poppy places the box so
       its bottom-centre lands on the prop's ground anchor, then scales by
       scaleAt(baseY) — the SAME depth curve creatures use. Y-SORTED prop.
       Default placement: x=470, baseY=690 (see docs/FARM-SCENE-SPEC.md). -->
  <defs>
    <linearGradient id="tWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6C48"/>
      <stop offset="1" stop-color="#43301F"/>
    </linearGradient>
    <linearGradient id="tWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#7ED6D4" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#3D8FBF" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#1E3A5F"/>
    </linearGradient>
    <filter id="tShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <ellipse cx="60" cy="75" rx="46" ry="7" fill="#0A1A14" opacity="0.55" filter="url(#tShadow)"/>

  <!-- water surface (inset, catches the dusk sky) -->
  <path fill="url(#tWater)" d="M20,34 h80 l-5,10 h-70 Z"/>
  <ellipse cx="60" cy="35" rx="39" ry="6" fill="#9BE7E4" opacity="0.55"/>
  <ellipse cx="48" cy="34" rx="12" ry="2.4" fill="#FFF6D8" opacity="0.5"/>

  <!-- body staves -->
  <path fill="url(#tWood)" d="M16,30 h88 l-8,42 h-72 Z"/>
  <g stroke="#2E2015" stroke-width="1" opacity="0.5">
    <path d="M34,31 l-4,41"/><path d="M52,31 l-2,41"/>
    <path d="M70,31 l2,41"/><path d="M88,31 l4,41"/>
  </g>
  <!-- iron bands -->
  <path fill="#3A4258" d="M17.5,42 h85 l-1.2,6 h-82.6 Z"/>
  <path fill="#3A4258" d="M21,60 h78 l-1.2,6 h-75.6 Z"/>
  <!-- rim + sun-side rim light (light from the left/centre) -->
  <path fill="#B99A6E" d="M16,29 h88 v4 h-88 Z"/>
  <path fill="#FFD98A" opacity="0.5" d="M16,29 h88 v1.4 h-88 Z"/>
</svg>
