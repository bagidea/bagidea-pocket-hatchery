<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMax slice">
  <!-- Pocket Hatchery · Farm scene LAYER 00 — SKY & LIGHT
       Flamingo (Designer) · 2026-07-17 · z-index 0
       Palette anchored to the live dark shell tokens (styles/tokens.css):
         top   #0B0F20 ≈ ph-shell-bg-bottom / canvas
         upper #131836  = ph-shell-bg-top (EXACT shell navy — the page and the
                          sky are literally the same colour at the top edge, so
                          the scene fuses with the app chrome, no seam)
         warm  #F59E0B  = ph-color-golden (horizon sun band)
       Horizon line = y 430. Everything above is sky; ground layers own y>430. -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#080A14"/>
      <stop offset="0.16" stop-color="#131836"/>
      <stop offset="0.38" stop-color="#26235A"/>
      <stop offset="0.58" stop-color="#4A2F63"/>
      <stop offset="0.74" stop-color="#8B4A5E"/>
      <stop offset="0.87" stop-color="#D4713F"/>
      <stop offset="0.96" stop-color="#F59E0B"/>
      <stop offset="1"    stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Sun bloom sitting on the horizon, slightly left of the barn -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5">
      <stop offset="0"    stop-color="#FFF6D8" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#FDE68A" stop-opacity="0.62"/>
      <stop offset="0.62" stop-color="#F59E0B" stop-opacity="0.26"/>
      <stop offset="1"    stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool aura echoing ph-aura-epic so the sky ties to the tier palette -->
    <radialGradient id="epicAura" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rareAura" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonGrad" cx="0.38" cy="0.34">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#E7ECFA"/>
      <stop offset="1"   stop-color="#BFC9E8"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="0.5" cy="0.5">
      <stop offset="0"    stop-color="#DCE6FF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#A9C0F5" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#A9C0F5" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft dusk clouds -->
    <linearGradient id="cloudWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC98A" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#B4577A" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="cloudCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7FD6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3A2E63" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="cloudBlur" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="starBlur" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- base sky -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- stars — only in the dark upper third, fading out before the warm band -->
  <g fill="#FFFFFF" filter="url(#starBlur)">
    <g opacity="0.85">
      <circle cx="118"  cy="58"  r="1.8"/><circle cx="286" cy="112" r="1.2"/>
      <circle cx="402"  cy="44"  r="2.1"/><circle cx="533" cy="150" r="1.1"/>
      <circle cx="651"  cy="76"  r="1.6"/><circle cx="795" cy="36"  r="1.3"/>
      <circle cx="884"  cy="128" r="1.9"/><circle cx="1012" cy="62" r="1.2"/>
      <circle cx="1147" cy="98"  r="1.5"/><circle cx="1420" cy="52" r="2.0"/>
      <circle cx="1520" cy="140" r="1.3"/><circle cx="1338" cy="182" r="1.1"/>
      <circle cx="196"  cy="196" r="1.4"/><circle cx="60"  cy="150" r="1.0"/>
      <circle cx="722"  cy="188" r="1.2"/><circle cx="960" cy="206" r="1.0"/>
    </g>
    <g opacity="0.4">
      <circle cx="240" cy="252" r="1.1"/><circle cx="612" cy="244" r="1.0"/>
      <circle cx="1080" cy="238" r="1.2"/><circle cx="1466" cy="262" r="1.0"/>
      <circle cx="352" cy="300" r="0.9"/><circle cx="1240" cy="292" r="0.9"/>
    </g>
  </g>

  <!-- moon, upper right — cool counter-light to the warm horizon -->
  <g>
    <circle cx="1298" cy="132" r="150" fill="url(#moonHalo)"/>
    <circle cx="1298" cy="132" r="34" fill="url(#moonGrad)"/>
    <g fill="#C3CEEC" opacity="0.5">
      <circle cx="1288" cy="122" r="6"/><circle cx="1310" cy="142" r="4.5"/>
      <circle cx="1294" cy="148" r="3"/>
    </g>
  </g>

  <!-- tier auras drifting in the sky (rare + epic, same hues as the app aura) -->
  <ellipse cx="380"  cy="180" rx="440" ry="220" fill="url(#rareAura)"/>
  <ellipse cx="1180" cy="250" rx="420" ry="200" fill="url(#epicAura)"/>

  <!-- clouds — cool up high, warm near the sun -->
  <g filter="url(#cloudBlur)">
    <g fill="url(#cloudCool)">
      <ellipse cx="300" cy="150" rx="170" ry="26"/>
      <ellipse cx="380" cy="138" rx="110" ry="20"/>
      <ellipse cx="1120" cy="112" rx="140" ry="20"/>
      <ellipse cx="1050" cy="122" rx="90"  ry="15"/>
    </g>
    <g fill="url(#cloudWarm)">
      <ellipse cx="640"  cy="300" rx="230" ry="24"/>
      <ellipse cx="740"  cy="288" rx="140" ry="17"/>
      <ellipse cx="1220" cy="336" rx="250" ry="22"/>
      <ellipse cx="1120" cy="326" rx="150" ry="15"/>
      <ellipse cx="260"  cy="360" rx="220" ry="20"/>
      <ellipse cx="880"  cy="386" rx="300" ry="18"/>
    </g>
  </g>

  <!-- the sun sitting on the horizon (centre-left, behind the far hills).
       Wide + generous on purpose: this warm band is what stops the top half of
       the frame reading as an empty navy slab. -->
  <ellipse cx="600" cy="430" rx="660" ry="360" fill="url(#sunGlow)"/>
  <ellipse cx="600" cy="430" rx="300" ry="150" fill="url(#sunGlow)" opacity="0.7"/>
  <circle  cx="600" cy="430" r="52" fill="#FFF6D8" opacity="0.92"/>

  <!-- distant bird flock — the cheapest possible "this world is alive" cue, and
       it gives the empty sky a focal point. Silhouettes only; they sit far
       behind everything, so they never touch the walkable band. -->
  <g fill="none" stroke="#2A2440" stroke-width="2.4" stroke-linecap="round" opacity="0.65">
    <path d="M846,214  q9,-7 18,0 q9,-7 18,0"/>
    <path d="M902,190  q7,-6 14,0 q7,-6 14,0"/>
    <path d="M946,232  q8,-6 16,0 q8,-6 16,0"/>
    <path d="M1000,206 q6,-5 12,0 q6,-5 12,0"/>
    <path d="M888,254  q6,-5 12,0 q6,-5 12,0"/>
    <path d="M1044,246 q5,-4 10,0 q5,-4 10,0"/>
  </g>
  <g fill="none" stroke="#3A3252" stroke-width="1.8" stroke-linecap="round" opacity="0.5">
    <path d="M320,268 q6,-5 12,0 q6,-5 12,0"/>
    <path d="M366,248 q5,-4 10,0 q5,-4 10,0"/>
    <path d="M404,282 q4,-4 8,0 q4,-4 8,0"/>
  </g>
</svg>
