<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Body gradient (translucent water) -->
    <radialGradient id="bodyOuter" cx="48%" cy="42%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E5F7A"/>
    </radialGradient>
    <!-- Inner glow core -->
    <radialGradient id="coreGlow" cx="50%" cy="48%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E0F7FA"/>
      <stop offset="70%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#26C6DA" stop-opacity="0"/>
    </radialGradient>
    <!-- Body highlight (top-left) -->
    <radialGradient id="bodyHL" cx="36%" cy="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Fin gradients (4 variants) -->
    <linearGradient id="finSimple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#00838F" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="finCrystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B39DDB" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Eye iris -->
    <radialGradient id="irisGrad" cx="36%" cy="30%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="50%" stop-color="#006064"/>
      <stop offset="100%" stop-color="#003040"/>
    </radialGradient>
    <!-- Ripple surface detail -->
    <radialGradient id="rippleGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .gene-tint { filter: hue-rotate(var(--gene-hue-shift, 0deg)) saturate(var(--gene-sat-mult, 1)) brightness(var(--gene-light-mult, 1)); }
    </style>
  </defs>

  <g class="gene-tint">
  <!-- ═══ BODY: Chubby water teardrop — translucent blob ═══ -->
  <g id="body">
    <!-- Ambient halo glow -->
    <ellipse cx="100" cy="108" rx="48" ry="54" fill="#22D3EE" opacity="0.1" filter="url(#softGlow)"/>

    <!-- === MAIN TEARDROP BODY === -->
    <!-- Drop shadow -->
    <path d="M103,44 Q136,86 132,135 Q128,168 103,172 Q100,173 97,172 Q72,168 68,135 Q64,86 97,44Z" fill="#005F7A" opacity="0.22"/>
    <!-- Body outer shell (translucent) -->
    <path d="M100,42 Q133,84 130,133 Q127,167 100,170 Q73,167 70,133 Q67,84 100,42Z"
          fill="url(#bodyOuter)" stroke="#006080" stroke-width="2.5" opacity="0.88"/>
    <!-- Inner translucency layer -->
    <path d="M100,48 Q127,88 124,133 Q121,160 100,163 Q79,160 76,133 Q73,88 100,48Z"
          fill="#A0E6F6" opacity="0.25"/>
    <!-- Cell-shade shadow band (bottom) -->
    <path d="M100,163 Q118,162 126,148 Q132,136 130,120" fill="none" stroke="#004D65" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
    <!-- Cell-shade highlight (top-left) -->
    <ellipse cx="86" cy="85" rx="22" ry="30" fill="#B2EEF8" opacity="0.42" transform="rotate(-10 86 85)"/>
    <!-- Specular highlight -->
    <ellipse cx="82" cy="76" rx="10" ry="16" fill="url(#bodyHL)"/>
    <!-- Rim light right edge -->
    <path d="M118,85 Q132,108 130,136 Q128,152 118,160" fill="none" stroke="#80DEEA" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- === INNER CORE GLOW === -->
    <circle cx="100" cy="115" r="26" fill="url(#coreGlow)" opacity="0.75" filter="url(#innerGlow)"/>

    <!-- === WATER RIPPLE TEXTURE (surface details) === -->
    <ellipse cx="96" cy="80" rx="12" ry="4" fill="url(#rippleGrad)" transform="rotate(-10 96 80)"/>
    <ellipse cx="104" cy="130" rx="14" ry="5" fill="url(#rippleGrad)" transform="rotate(5 104 130)"/>
    <ellipse cx="88" cy="112" rx="8" ry="3" fill="url(#rippleGrad)" transform="rotate(-20 88 112)"/>
    <!-- Small bubble dots on surface -->
    <circle cx="88" cy="72" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.45"/>
    <circle cx="114" cy="80" r="2.5" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.38"/>
    <circle cx="84" cy="146" r="2.8" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.38"/>
    <circle cx="116" cy="152" r="2" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.32"/>

    <!-- === DEFAULT SIMPLE FINS === -->
    <path d="M62,106 Q42,90 46,120 Q48,140 62,134Z"
          fill="url(#finSimple)" stroke="#006080" stroke-width="0.9" opacity="0.85"/>
    <!-- Fin highlight -->
    <path d="M62,112 Q50,100 52,118" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <path d="M138,106 Q158,90 154,120 Q152,140 138,134Z"
          fill="url(#finSimple)" stroke="#006080" stroke-width="0.9" opacity="0.85"/>
    <path d="M138,112 Q150,100 148,118" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

    <!-- === FACE === -->
    <!-- Left eye socket -->
    <ellipse cx="85" cy="100" rx="9.5" ry="11" fill="#0A1A2A"/>
    <!-- Left iris -->
    <ellipse cx="85" cy="100" rx="7.5" ry="9" fill="url(#irisGrad)"/>
    <!-- Left pupil -->
    <ellipse cx="85" cy="101" rx="5" ry="6" fill="#0A1A2A"/>
    <!-- Left eye sparkles (water = multi-catchlight) -->
    <circle cx="81" cy="95" r="3.2" fill="#FFFFFF"/>
    <circle cx="88" cy="93" r="1.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="90" cy="104" r="1.2" fill="#FFFFFF" opacity="0.72"/>
    <!-- Left eye glint -->
    <ellipse cx="81" cy="95" rx="1.5" ry="1" fill="#E0F7FA" opacity="0.6"/>

    <!-- Right eye socket -->
    <ellipse cx="115" cy="100" rx="9.5" ry="11" fill="#0A1A2A"/>
    <!-- Right iris -->
    <ellipse cx="115" cy="100" rx="7.5" ry="9" fill="url(#irisGrad)"/>
    <!-- Right pupil -->
    <ellipse cx="115" cy="101" rx="5" ry="6" fill="#0A1A2A"/>
    <!-- Right eye sparkles -->
    <circle cx="111" cy="95" r="3.2" fill="#FFFFFF"/>
    <circle cx="118" cy="93" r="1.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="120" cy="104" r="1.2" fill="#FFFFFF" opacity="0.72"/>
    <ellipse cx="111" cy="95" rx="1.5" ry="1" fill="#E0F7FA" opacity="0.6"/>

    <!-- Eye outline rings -->
    <ellipse cx="85" cy="100" rx="9.5" ry="11" fill="none" stroke="#003040" stroke-width="1.2"/>
    <ellipse cx="115" cy="100" rx="9.5" ry="11" fill="none" stroke="#003040" stroke-width="1.2"/>

    <!-- Blush cheeks -->
    <circle cx="70" cy="110" r="10" fill="#F472B6" opacity="0.35"/>
    <circle cx="130" cy="110" r="10" fill="#F472B6" opacity="0.35"/>
    <!-- Blush inner highlight -->
    <circle cx="68" cy="107" r="4.5" fill="#FBBDE2" opacity="0.3"/>
    <circle cx="128" cy="107" r="4.5" fill="#FBBDE2" opacity="0.3"/>

    <!-- Mouth (gentle smile) -->
    <path d="M92,112 Q100,119 108,112" fill="none" stroke="#003848" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ═══ TRAIT: Core Shape (slot-core) ═══ -->
  <g id="slot-core-0">
    <circle cx="100" cy="115" r="26" fill="url(#coreGlow)" opacity="0.75" filter="url(#innerGlow)"/>
  </g>
  <g id="slot-core-1" style="display:none"><!-- heart core -->
    <path d="M100,125 Q100,109 110,113 Q120,109 120,118 Q120,127 100,138 Q80,127 80,118 Q80,109 90,113Z"
          fill="url(#coreGlow)" opacity="0.78" filter="url(#innerGlow)" transform="translate(0,-3) scale(1.08)"/>
  </g>
  <g id="slot-core-2" style="display:none"><!-- star core -->
    <path d="M100,96 L103.8,108 L116,109 L107,116 L110,128 L100,121.5 L90,128 L93,116 L84,109 L96.2,108Z"
          fill="url(#coreGlow)" opacity="0.8" filter="url(#innerGlow)"/>
  </g>
  <g id="slot-core-3" style="display:none"><!-- diamond core -->
    <polygon points="100,96 117,114 100,132 83,114"
             fill="url(#coreGlow)" opacity="0.78" filter="url(#innerGlow)"/>
  </g>

  <!-- ═══ TRAIT: Fin Style (slot-fins) ═══ -->
  <g id="slot-fins-0"><!-- simple: already in body --></g>
  <g id="slot-fins-1" style="display:none"><!-- flowing long fins -->
    <path d="M62,100 Q32,82 36,122 Q38,146 62,138 Q46,122 50,104Z"
          fill="url(#finSimple)" stroke="#006080" stroke-width="0.9" opacity="0.78"/>
    <path d="M138,100 Q168,82 164,122 Q162,146 138,138 Q154,122 150,104Z"
          fill="url(#finSimple)" stroke="#006080" stroke-width="0.9" opacity="0.78"/>
    <path d="M62,108 Q44,98 46,118" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M138,108 Q156,98 154,118" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  </g>
  <g id="slot-fins-2" style="display:none"><!-- wide wing fins -->
    <path d="M62,106 Q28,78 32,116 Q36,144 62,138Z"
          fill="url(#finSimple)" stroke="#006080" stroke-width="0.9" opacity="0.85"/>
    <path d="M138,106 Q172,78 168,116 Q164,144 138,138Z"
          fill="url(#finSimple)" stroke="#006080" stroke-width="0.9" opacity="0.85"/>
    <path d="M62,110 Q38,94 40,118" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M138,110 Q162,94 160,118" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  </g>
  <g id="slot-fins-3" style="display:none"><!-- crystal prism fins -->
    <polygon points="62,100 40,106 48,126 62,130" fill="url(#finCrystal)" stroke="#B39DDB" stroke-width="0.6" opacity="0.85" filter="url(#glow)"/>
    <polygon points="48,126 40,120 46,134" fill="#FFFFFF" opacity="0.45"/>
    <line x1="62" y1="100" x2="40" y2="106" stroke="#FFFFFF" stroke-width="0.8" opacity="0.55"/>
    <polygon points="138,100 160,106 152,126 138,130" fill="url(#finCrystal)" stroke="#B39DDB" stroke-width="0.6" opacity="0.85" filter="url(#glow)"/>
    <polygon points="152,126 160,120 154,134" fill="#FFFFFF" opacity="0.45"/>
    <line x1="138" y1="100" x2="160" y2="106" stroke="#FFFFFF" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- ═══ TRAIT: Transparency (slot-clarity) ═══ -->
  <g id="slot-clarity-0"><!-- clear: default --></g>
  <g id="slot-clarity-1" style="display:none"><!-- misty -->
    <ellipse cx="88" cy="78" rx="18" ry="22" fill="#FAFAFA" opacity="0.15"/>
    <ellipse cx="110" cy="95" rx="14" ry="18" fill="#FAFAFA" opacity="0.1"/>
  </g>
  <g id="slot-clarity-2" style="display:none"><!-- shimmer -->
    <circle cx="84" cy="70" r="3.5" fill="#FAFAFA" opacity="0.52"><animate attributeName="opacity" values="0.52;0.18;0.52" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="117" cy="78" r="2.8" fill="#FAFAFA" opacity="0.42"><animate attributeName="opacity" values="0.42;0.12;0.42" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="140" r="2.2" fill="#FAFAFA" opacity="0.37"><animate attributeName="opacity" values="0.37;0.1;0.37" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="114" cy="155" r="2" fill="#FAFAFA" opacity="0.32"><animate attributeName="opacity" values="0.32;0.08;0.32" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>
  <g id="slot-clarity-3" style="display:none"><!-- prismatic -->
    <ellipse cx="100" cy="108" rx="32" ry="38" fill="none" stroke="#B39DDB" stroke-width="1.2" opacity="0.45" filter="url(#glow)"/>
    <ellipse cx="100" cy="108" rx="25" ry="30" fill="none" stroke="#F472B6" stroke-width="0.9" opacity="0.35"/>
    <ellipse cx="100" cy="108" rx="18" ry="22" fill="none" stroke="#67E8F9" stroke-width="0.7" opacity="0.3"/>
  </g>

  <!-- ═══ RARITY OVERLAYS ═══ -->
  <g id="rare-iridescent" style="display:none">
    <ellipse cx="100" cy="108" rx="40" ry="47" fill="none" stroke="#B39DDB" stroke-width="1.5" opacity="0.52" stroke-dasharray="6,4"/>
  </g>
  <g id="legendary-aura" style="display:none">
    <circle cx="100" cy="108" r="58" fill="#06B6D4" opacity="0.09" filter="url(#softGlow)"/>
    <circle cx="74" cy="80" r="2.5" fill="#E0F7FA" opacity="0.52"><animate attributeName="opacity" values="0.52;0.15;0.52" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="128" cy="90" r="2" fill="#E0F7FA" opacity="0.42"><animate attributeName="opacity" values="0.42;0.1;0.42" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="148" r="1.8" fill="#B39DDB" opacity="0.38"><animate attributeName="opacity" values="0.38;0.1;0.38" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g id="mut-shiny" style="display:none"><ellipse cx="100" cy="108" rx="42" ry="49" fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.35" stroke-dasharray="5,5"/></g>
  <g id="mut-prismatic" style="display:none"><ellipse cx="100" cy="108" rx="44" ry="51" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.47" filter="url(#glow)"/></g>
  <g id="mut-ethereal" style="display:none"><circle cx="100" cy="108" r="54" fill="#A78BFA" opacity="0.07" filter="url(#softGlow)"/></g>
  </g>
</svg>
