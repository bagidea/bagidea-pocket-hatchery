<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#22C55E"/></radialGradient>
    <radialGradient id="tailGrad" cx="40%" cy="40%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#059669"/></radialGradient>
    <radialGradient id="eyeShine" cx="35%" cy="30%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FAFAFA"/></radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%"><stop offset="0%" stop-color="#FDA4AF"/><stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/></radialGradient>
    <radialGradient id="crystalGrad" cx="30%" cy="30%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#FDE68A"/><stop offset="100%" stop-color="#F59E0B"/></radialGradient>
    <radialGradient id="legendAura" cx="50%" cy="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FB923C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foilShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="goldGlowFilter"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- Background (deep warm dark) -->
  <rect width="200" height="210" fill="#0D0804"/>

  <!-- ═══ LEGENDARY AURA (behind creature) ═══ -->
  <circle cx="100" cy="108" r="90" fill="url(#legendAura)"/>
  <circle cx="100" cy="108" r="80" fill="#B45309" opacity="0.25" filter="url(#bigGlow)"/>
  <!-- Gold rings (solid, more presence than Epic dashes) -->
  <circle cx="100" cy="108" r="74" fill="none" stroke="#F59E0B" stroke-width="1.8" opacity="0.6"/>
  <circle cx="100" cy="108" r="66" fill="none" stroke="#FDE68A" stroke-width="0.8" opacity="0.4"/>
  <circle cx="100" cy="108" r="58" fill="none" stroke="#F59E0B" stroke-width="0.4" opacity="0.25"/>

  <!-- ═══ CREATURE (foxling) ═══ -->
  <!-- Extra-fluffy tail (Legendary upgrade) -->
  <path d="M128,110 Q165,80 160,125 Q168,145 138,140 Q145,125 128,110Z" fill="url(#tailGrad)" stroke="#059669" stroke-width="1"/>
  <circle cx="155" cy="110" r="12" fill="#6EE7B7" opacity="0.5"/>
  <circle cx="158" cy="125" r="10" fill="#34D399" opacity="0.4"/>
  <!-- Crystal tail cap -->
  <polygon points="164,100 169,90 167,102 175,94 168,106 161,106" fill="url(#crystalGrad)" filter="url(#goldGlowFilter)"/>
  <!-- Ears -->
  <polygon points="66,48 58,12 76,42" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <polygon points="66,48 60,16 70,42" fill="#F43F5E" opacity="0.45"/>
  <polygon points="134,48 142,12 124,42" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <polygon points="134,48 140,16 130,42" fill="#F43F5E" opacity="0.45"/>
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="38" ry="42" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <!-- Foil shimmer overlay on body -->
  <ellipse cx="100" cy="120" rx="38" ry="42" fill="url(#foilShimmer)" opacity="0.7"/>
  <!-- Head -->
  <circle cx="100" cy="72" r="36" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <!-- Foil shimmer on head -->
  <circle cx="100" cy="72" r="36" fill="url(#foilShimmer)" opacity="0.6"/>
  <!-- Cheeks -->
  <circle cx="76" cy="82" r="12" fill="url(#cheekGrad)"/>
  <circle cx="124" cy="82" r="12" fill="url(#cheekGrad)"/>
  <!-- Eyes (golden glow — Legendary) -->
  <ellipse cx="86" cy="72" rx="9" ry="11" fill="#1E1B4B"/>
  <ellipse cx="114" cy="72" rx="9" ry="11" fill="#1E1B4B"/>
  <circle cx="83" cy="68" r="3.5" fill="url(#eyeShine)"/>
  <circle cx="89" cy="74" r="1.5" fill="url(#eyeShine)"/>
  <circle cx="111" cy="68" r="3.5" fill="url(#eyeShine)"/>
  <circle cx="117" cy="74" r="1.5" fill="url(#eyeShine)"/>
  <ellipse cx="86" cy="72" rx="9" ry="11" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.75" filter="url(#glow)"/>
  <ellipse cx="114" cy="72" rx="9" ry="11" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.75" filter="url(#glow)"/>
  <!-- Nose & mouth -->
  <ellipse cx="100" cy="80" rx="4" ry="3" fill="#1E1B4B"/>
  <path d="M96,83 Q100,87 104,83" fill="none" stroke="#1E1B4B" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="82" cy="150" rx="12" ry="8" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <ellipse cx="118" cy="150" rx="12" ry="8" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <ellipse cx="78" cy="158" rx="10" ry="6" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <ellipse cx="122" cy="158" rx="10" ry="6" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <!-- Star forehead mark (Legendary) -->
  <path d="M100,47 L102,53 L108,54 L103,58 L104,64 L100,61 L96,64 L97,58 L92,54 L98,53Z" fill="#F59E0B" opacity="0.9" filter="url(#goldGlowFilter)"/>

  <!-- CROWN (Legendary exclusive) -->
  <g filter="url(#goldGlowFilter)">
    <!-- Crown base -->
    <path d="M84,34 L84,26 L90,32 L100,22 L110,32 L116,26 L116,34 Z" fill="url(#crownGrad)" stroke="#FDE68A" stroke-width="0.8"/>
    <!-- Crown jewels -->
    <circle cx="100" cy="24" r="3" fill="#F43F5E" opacity="0.9"/>
    <circle cx="90" cy="30" r="2" fill="#A78BFA" opacity="0.8"/>
    <circle cx="110" cy="30" r="2" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- ═══ LEGENDARY PARTICLES (8 gold orbs + 2 stars) ═══ -->
  <circle cx="42" cy="78" r="4" fill="#F59E0B" opacity="0.9" filter="url(#glow)"/>
  <circle cx="162" cy="65" r="3" fill="#FDE68A" opacity="0.85" filter="url(#glow)"/>
  <circle cx="168" cy="118" r="3.5" fill="#F59E0B" opacity="0.8" filter="url(#glow)"/>
  <circle cx="35" cy="128" r="2.5" fill="#FDE68A" opacity="0.75" filter="url(#glow)"/>
  <circle cx="112" cy="180" r="3" fill="#F59E0B" opacity="0.7" filter="url(#glow)"/>
  <circle cx="58" cy="168" r="2" fill="#FDE68A" opacity="0.65" filter="url(#glow)"/>
  <circle cx="50" cy="52" r="3" fill="#F59E0B" opacity="0.7" filter="url(#glow)"/>
  <circle cx="152" cy="158" r="2.5" fill="#FDE68A" opacity="0.6" filter="url(#glow)"/>
  <!-- Star sparks (gold) -->
  <path d="M162,44 L164,38 L166,44 L172,46 L166,48 L164,54 L162,48 L156,46Z" fill="#FDE68A" opacity="0.9" filter="url(#glow)"/>
  <path d="M34,100 L35.5,96 L37,100 L41,101.5 L37,103 L35.5,107 L34,103 L30,101.5Z" fill="#FDE68A" opacity="0.75" filter="url(#glow)"/>

  <!-- Rarity badge -->
  <rect x="48" y="194" width="104" height="13" rx="6.5" fill="#451A03" opacity="0.9"/>
  <text x="100" y="204" text-anchor="middle" font-family="'Nunito', system-ui, sans-serif" font-size="7" font-weight="700" letter-spacing="2" fill="#F59E0B">◆ LEGENDARY</text>
</svg>
