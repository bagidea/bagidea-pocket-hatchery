<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#22C55E"/></radialGradient>
    <radialGradient id="tailGrad" cx="40%" cy="40%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#059669"/></radialGradient>
    <radialGradient id="eyeShine" cx="35%" cy="30%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FAFAFA"/></radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%"><stop offset="0%" stop-color="#FDA4AF"/><stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/></radialGradient>
    <radialGradient id="crystalGrad" cx="30%" cy="30%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#8B5CF6"/></radialGradient>
    <radialGradient id="epicAura" cx="50%" cy="48%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="52%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="crystalGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="210" fill="#0C0A1E"/>

  <!-- ═══ EPIC AURA (behind creature) ═══ -->
  <circle cx="100" cy="108" r="85" fill="url(#epicAura)"/>
  <circle cx="100" cy="108" r="76" fill="#6D28D9" opacity="0.18" filter="url(#bigGlow)"/>
  <!-- Aura rings -->
  <circle cx="100" cy="108" r="70" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="7,5" opacity="0.55"/>
  <circle cx="100" cy="108" r="63" fill="none" stroke="#A78BFA" stroke-width="0.6" opacity="0.3"/>

  <!-- ═══ CREATURE (foxling) ═══ -->
  <!-- Crystal tail tip -->
  <path d="M130,110 Q155,85 152,118 Q158,135 138,138 Q145,122 130,110Z" fill="url(#tailGrad)" stroke="#059669" stroke-width="1"/>
  <polygon points="155,98 160,88 158,100 165,92 160,102 152,102" fill="url(#crystalGrad)" filter="url(#crystalGlow)"/>
  <!-- Ears -->
  <polygon points="66,48 58,12 76,42" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <polygon points="66,48 60,16 70,42" fill="#F43F5E" opacity="0.45"/>
  <polygon points="134,48 142,12 124,42" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <polygon points="134,48 140,16 130,42" fill="#F43F5E" opacity="0.45"/>
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="38" ry="42" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <!-- Head -->
  <circle cx="100" cy="72" r="36" fill="url(#bodyGrad)" stroke="#059669" stroke-width="1"/>
  <!-- Cheeks -->
  <circle cx="76" cy="82" r="12" fill="url(#cheekGrad)"/>
  <circle cx="124" cy="82" r="12" fill="url(#cheekGrad)"/>
  <!-- Eyes -->
  <ellipse cx="86" cy="72" rx="9" ry="11" fill="#1E1B4B"/>
  <ellipse cx="114" cy="72" rx="9" ry="11" fill="#1E1B4B"/>
  <circle cx="83" cy="68" r="3.5" fill="url(#eyeShine)"/>
  <circle cx="89" cy="74" r="1.5" fill="url(#eyeShine)"/>
  <circle cx="111" cy="68" r="3.5" fill="url(#eyeShine)"/>
  <circle cx="117" cy="74" r="1.5" fill="url(#eyeShine)"/>
  <!-- Epic eye-iris glow -->
  <ellipse cx="86" cy="72" rx="9" ry="11" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="114" cy="72" rx="9" ry="11" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.7" filter="url(#glow)"/>
  <!-- Nose -->
  <ellipse cx="100" cy="80" rx="4" ry="3" fill="#1E1B4B"/>
  <!-- Mouth -->
  <path d="M96,83 Q100,87 104,83" fill="none" stroke="#1E1B4B" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="82" cy="150" rx="12" ry="8" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <ellipse cx="118" cy="150" rx="12" ry="8" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <ellipse cx="78" cy="158" rx="10" ry="6" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <ellipse cx="122" cy="158" rx="10" ry="6" fill="#34D399" stroke="#22C55E" stroke-width="0.8"/>
  <!-- Diamond forehead mark (Epic signature) -->
  <polygon points="100,50 106,56 100,62 94,56" fill="#A78BFA" opacity="0.9" filter="url(#crystalGlow)"/>

  <!-- ═══ EPIC PARTICLES (5 orbs + 1 star) ═══ -->
  <circle cx="46" cy="86" r="3.5" fill="#A78BFA" opacity="0.9" filter="url(#glow)"/>
  <circle cx="160" cy="70" r="2.5" fill="#C4B5FD" opacity="0.85" filter="url(#glow)"/>
  <circle cx="163" cy="122" r="3" fill="#7C3AED" opacity="0.8" filter="url(#glow)"/>
  <circle cx="40" cy="132" r="2" fill="#DDD6FE" opacity="0.75" filter="url(#glow)"/>
  <circle cx="106" cy="178" r="2.5" fill="#8B5CF6" opacity="0.65" filter="url(#glow)"/>
  <!-- Star spark -->
  <path d="M158,48 L160,43 L162,48 L167,50 L162,52 L160,57 L158,52 L153,50Z" fill="#EDE9FE" opacity="0.85" filter="url(#glow)"/>

  <!-- Rarity badge -->
  <rect x="68" y="194" width="64" height="13" rx="6.5" fill="#3B0764" opacity="0.85"/>
  <text x="100" y="204" text-anchor="middle" font-family="'Nunito', system-ui, sans-serif" font-size="7" font-weight="700" letter-spacing="2.5" fill="#A78BFA">⬡ EPIC</text>
</svg>
