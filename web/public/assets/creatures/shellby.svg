<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="50%"><stop offset="0%" stop-color="#FFD0D8"/><stop offset="100%" stop-color="#F43F5E"/></radialGradient>
    <radialGradient id="shellPearl" cx="40%" cy="35%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#FAFAFA"/><stop offset="100%" stop-color="#D4C8B8"/></radialGradient>
    <radialGradient id="shellCoral" cx="40%" cy="35%"><stop offset="0%" stop-color="#FFE0E0"/><stop offset="60%" stop-color="#FFB8B8"/><stop offset="100%" stop-color="#E89090"/></radialGradient>
    <radialGradient id="shellAbalone" cx="40%" cy="35%"><stop offset="0%" stop-color="#FAFAFA"/><stop offset="40%" stop-color="#A78BFA"/><stop offset="70%" stop-color="#7EC8E0"/><stop offset="100%" stop-color="#06B6D4"/></radialGradient>
    <radialGradient id="shellBlack" cx="40%" cy="35%"><stop offset="0%" stop-color="#5C5C7A"/><stop offset="60%" stop-color="#2A2A3A"/><stop offset="100%" stop-color="#0A0A18"/></radialGradient>
    <linearGradient id="spiralGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#D4C8B8"/><stop offset="100%" stop-color="#B0A090"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
      <style>
      .gene-tint { filter: hue-rotate(var(--gene-hue-shift, 0deg)) saturate(var(--gene-sat-mult, 1)) brightness(var(--gene-light-mult, 1)); }
    </style>  </defs>

  <g class="gene-tint">
  <!-- ═══ BODY: Slug body + shell on back ═══ -->
  <g id="body">
    <!-- Slug body -->
    <ellipse cx="100" cy="130" rx="30" ry="22" fill="url(#bodyGrad)" stroke="#E87090" stroke-width="0.8"/>
    <!-- Head -->
    <circle cx="100" cy="105" r="18" fill="url(#bodyGrad)" stroke="#E87090" stroke-width="0.8"/>
    <!-- Antennae -->
    <path d="M92,90 Q88,72 90,65" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,90 Q112,72 110,65" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyes on antennae tips -->
    <circle cx="90" cy="65" r="5" fill="#FAFAFA"/>
    <circle cx="110" cy="65" r="5" fill="#FAFAFA"/>
    <circle cx="89" cy="64" r="3" fill="#1E1B4B"/>
    <circle cx="109" cy="64" r="3" fill="#1E1B4B"/>
    <circle cx="88" cy="62.5" r="1.2" fill="#FAFAFA"/>
    <circle cx="108" cy="62.5" r="1.2" fill="#FAFAFA"/>
    <!-- Mouth -->
    <path d="M96,110 Q100,114 104,110" fill="none" stroke="#E87090" stroke-width="1" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="88" cy="110" r="5" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="112" cy="110" r="5" fill="#FFFFFF" opacity="0.25"/>
    <!-- Shell (spiral on back) -->
    <circle cx="100" cy="115" r="32" fill="url(#shellPearl)" stroke="#C4B898" stroke-width="1"/>
    <path d="M100,115 Q85,105 90,95 Q98,85 110,90 Q120,98 112,110 Q105,120 95,115" fill="none" stroke="url(#spiralGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Shell highlight -->
    <ellipse cx="88" cy="101" rx="8" ry="4" fill="#FAFAFA" opacity="0.4" transform="rotate(-30 88 101)"/>
  </g>

  <!-- ═══ TRAIT: Shell Type (slot-shelltype) ═══ -->
  <g id="slot-shelltype-0"><!-- spiral: default shell --></g>
  <g id="slot-shelltype-1" style="display:none"><!-- conch -->
    <circle cx="100" cy="115" r="32" fill="url(#shellPearl)" stroke="#C4B898" stroke-width="1"/>
    <path d="M100,83 Q120,83 125,95 Q132,110 120,125 Q110,138 95,135 Q80,132 75,118 Q70,105 80,95 Q88,86 100,83Z" fill="none" stroke="url(#spiralGrad)" stroke-width="2"/>
    <!-- Conch point -->
    <polygon points="100,83 95,70 105,75" fill="#FAFAFA"/>
  </g>
  <g id="slot-shelltype-2" style="display:none"><!-- nautilus -->
    <circle cx="100" cy="115" r="32" fill="url(#shellPearl)" stroke="#C4B898" stroke-width="1"/>
    <!-- Chamber lines -->
    <path d="M100,83 Q110,95 100,107" fill="none" stroke="#C4B898" stroke-width="1" opacity="0.6"/>
    <path d="M100,83 Q120,100 105,115" fill="none" stroke="#C4B898" stroke-width="1" opacity="0.5"/>
    <path d="M100,83 Q130,105 95,125" fill="none" stroke="#C4B898" stroke-width="1" opacity="0.4"/>
    <path d="M100,83 Q115,120 100,140" fill="none" stroke="#C4B898" stroke-width="1" opacity="0.3"/>
  </g>
  <g id="slot-shelltype-3" style="display:none"><!-- crown -->
    <circle cx="100" cy="115" r="32" fill="url(#shellPearl)" stroke="#C4B898" stroke-width="1"/>
    <!-- Crown points on top of shell -->
    <polygon points="82,100 80,78 88,92" fill="#FAFAFA" stroke="#C4B898" stroke-width="0.8"/>
    <polygon points="100,85 100,68 108,88" fill="#FAFAFA" stroke="#C4B898" stroke-width="0.8"/>
    <polygon points="118,100 120,78 112,92" fill="#FAFAFA" stroke="#C4B898" stroke-width="0.8"/>
  </g>

  <!-- ═══ TRAIT: Shell Color (slot-shellcolor) ═══ -->
  <g id="slot-shellcolor-0"><!-- pearl: default --></g>
  <g id="slot-shellcolor-1" style="display:none"><!-- coral -->
    <circle cx="100" cy="115" r="32" fill="url(#shellCoral)" stroke="#D08080" stroke-width="1"/>
    <ellipse cx="88" cy="101" rx="8" ry="4" fill="#FFE0E0" opacity="0.4" transform="rotate(-30 88 101)"/>
  </g>
  <g id="slot-shellcolor-2" style="display:none"><!-- abalone -->
    <circle cx="100" cy="115" r="32" fill="url(#shellAbalone)" stroke="#06B6D4" stroke-width="1"/>
    <ellipse cx="88" cy="101" rx="8" ry="4" fill="#FAFAFA" opacity="0.5" transform="rotate(-30 88 101)"/>
  </g>
  <g id="slot-shellcolor-3" style="display:none"><!-- black pearl -->
    <circle cx="100" cy="115" r="32" fill="url(#shellBlack)" stroke="#0A0A18" stroke-width="1"/>
    <ellipse cx="88" cy="101" rx="8" ry="4" fill="#5C5C7A" opacity="0.5" transform="rotate(-30 88 101)"/>
  </g>

  <!-- ═══ TRAIT: Antennae (slot-antennae) ═══ -->
  <g id="slot-antennae-0"><!-- short: default antennae --></g>
  <g id="slot-antennae-1" style="display:none"><!-- feathered -->
    <path d="M92,90 Q78,70 86,58" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M86,58 L80,52 M86,60 L82,56 M87,64 L84,62" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M108,90 Q122,70 114,58" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M114,58 L120,52 M114,60 L118,56 M113,64 L116,62" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g id="slot-antennae-2" style="display:none"><!-- star-tipped -->
    <path d="M92,90 Q88,68 90,58" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M90,54 L88,58 L84,56 L89,60 L86,64 L90,61 L94,64 L91,60 L96,56 L92,58Z" fill="#F59E0B" filter="url(#glow)"/>
    <path d="M108,90 Q112,68 110,58" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M110,54 L108,58 L104,56 L109,60 L106,64 L110,61 L114,64 L111,60 L116,56 L112,58Z" fill="#F59E0B" filter="url(#glow)"/>
  </g>
  <g id="slot-antennae-3" style="display:none"><!-- glowing -->
    <path d="M92,90 Q86,65 90,55" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M108,90 Q114,65 110,55" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- ═══ RARITY ═══ -->
  <g id="rare-iridescent" style="display:none">
    <ellipse cx="100" cy="115" rx="44" ry="50" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4"/>
  </g>
  <g id="legendary-aura" style="display:none">
    <circle cx="100" cy="115" r="55" fill="#FAFAFA" opacity="0.06" filter="url(#softGlow)"/>
    <circle cx="75" cy="90" r="2" fill="#FAFAFA" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g id="mut-shiny" style="display:none"><ellipse cx="100" cy="115" rx="46" ry="52" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/></g>
  <g id="mut-prismatic" style="display:none"><ellipse cx="100" cy="115" rx="44" ry="50" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/></g>
  <g id="mut-ethereal" style="display:none"><circle cx="100" cy="115" r="52" fill="#A78BFA" opacity="0.06" filter="url(#softGlow)"/></g>
  </g>
</svg>
