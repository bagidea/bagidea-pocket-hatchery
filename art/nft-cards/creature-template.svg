<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="pockethatch-creature">
  <defs>
    <style>
      :root {
        --critter-base: #10B981;
        --critter-base-dark: #059669;
        --critter-accent: #F59E0B;
        --critter-pattern: #F43F5E;
        --critter-belly: #FAFAFA;
        --critter-eye: #1E1B4B;
        --critter-eye-shine: #FFFFFF;
        --critter-nose: #F43F5E;
        --critter-pattern-opacity: 0.55;
        --critter-pat-idx: 0; /* 0=stripes 1=spots 2=hearts 3=stars — toggle by client */
      }
      .body-shape { fill: var(--critter-base); }
      .body-shadow { fill: var(--critter-base-dark); }
      .accent-part { fill: var(--critter-accent); }
      .pattern-part { fill: var(--critter-pattern); opacity: var(--critter-pattern-opacity); }
      .belly-part { fill: var(--critter-belly); }
      .eye-fill { fill: var(--critter-eye); }
      /* Show only the active pattern group based on --critter-pat-idx (attribute-driven) */
      .pat-stripes, .pat-spots, .pat-hearts, .pat-stars { display: none; }
      :root[data-pat="0"] .pat-stripes { display: inline; }
      :root[data-pat="1"] .pat-spots   { display: inline; }
      :root[data-pat="2"] .pat-hearts  { display: inline; }
      :root[data-pat="3"] .pat-stars   { display: inline; }
      /* Gene-driven hue shift (matches render/engine.js CSS variable naming) */
      .gene-tint { filter: hue-rotate(var(--gene-hue-shift, 0deg)) saturate(var(--gene-sat-mult, 1)) brightness(var(--gene-light-mult, 1)); }
    </style>

    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="80%" stop-color="rgba(0,0,0,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </radialGradient>

    <clipPath id="bodyClip">
      <ellipse cx="256" cy="280" rx="110" ry="115"/>
    </clipPath>
  </defs>

  <g class="gene-tint">
  <!-- Contact shadow -->
  <ellipse cx="256" cy="430" rx="95" ry="16" fill="rgba(58,58,82,0.22)"/>

  <!-- Tail (accent) -->
  <g class="accent-part">
    <ellipse cx="370" cy="330" rx="50" ry="35" transform="rotate(-20 370 330)"/>
    <ellipse cx="385" cy="310" rx="35" ry="25" transform="rotate(-35 385 310)"/>
    <circle cx="410" cy="300" r="14"/>
    <circle cx="398" cy="288" r="10"/>
  </g>

  <!-- Ears -->
  <g class="accent-part">
    <ellipse cx="175" cy="140" rx="30" ry="55" transform="rotate(-18 175 140)"/>
    <ellipse cx="173" cy="145" rx="16" ry="35" transform="rotate(-18 173 145)" class="belly-part"/>
  </g>
  <g class="accent-part">
    <ellipse cx="320" cy="135" rx="30" ry="58" transform="rotate(15 320 135)"/>
    <ellipse cx="318" cy="140" rx="16" ry="38" transform="rotate(15 318 140)" class="belly-part"/>
  </g>

  <!-- Body -->
  <ellipse cx="256" cy="290" rx="115" ry="120" class="body-shape"/>
  <ellipse cx="256" cy="290" rx="115" ry="120" fill="url(#bodyGrad)"/>
  <ellipse cx="256" cy="350" rx="90" ry="45" class="body-shadow" opacity="0.35"/>

  <!-- ====== PATTERN GROUPS (toggle with --critter-pat-idx) ====== -->
  <g clip-path="url(#bodyClip)">

    <!-- Pattern 0: STRIPES (diagonal bands across body) -->
    <g class="pat-stripes">
      <ellipse cx="200" cy="220" rx="38" ry="10" transform="rotate(-18 200 220)" class="pattern-part"/>
      <ellipse cx="225" cy="238" rx="40" ry="10" transform="rotate(-12 225 238)" class="pattern-part"/>
      <ellipse cx="252" cy="256" rx="42" ry="10" transform="rotate(-6 252 256)" class="pattern-part"/>
      <ellipse cx="278" cy="242" rx="40" ry="10" transform="rotate(2 278 242)" class="pattern-part"/>
      <ellipse cx="305" cy="228" rx="38" ry="10" transform="rotate(8 305 228)" class="pattern-part"/>
      <ellipse cx="330" cy="215" rx="35" ry="10" transform="rotate(14 330 215)" class="pattern-part"/>
      <ellipse cx="256" cy="195" rx="18" ry="14" class="pattern-part"/>
    </g>

    <!-- Pattern 1: SPOTS (scattered dots) -->
    <g class="pat-spots">
      <circle cx="210" cy="215" r="12" class="pattern-part"/>
      <circle cx="270" cy="205" r="14" class="pattern-part"/>
      <circle cx="185" cy="260" r="10" class="pattern-part"/>
      <circle cx="305" cy="255" r="13" class="pattern-part"/>
      <circle cx="230" cy="305" r="11" class="pattern-part"/>
      <circle cx="280" cy="315" r="9" class="pattern-part"/>
      <circle cx="200" cy="340" r="11" class="pattern-part"/>
      <circle cx="315" cy="340" r="10" class="pattern-part"/>
      <circle cx="256" cy="195" rx="18" ry="14" class="pattern-part"/>
    </g>

    <!-- Pattern 2: HEARTS (cute heart markings) -->
    <g class="pat-hearts">
      <path d="M208,215 Q202,208 208,202 Q214,208 208,215Z" transform="scale(1.3) translate(-60,-50)" class="pattern-part"/>
      <path d="M270,220 Q264,213 270,207 Q276,213 270,220Z" transform="scale(1.1) translate(-25,-35)" class="pattern-part"/>
      <path d="M190,265 Q184,258 190,252 Q196,258 190,265Z" transform="scale(1.0) translate(-5,-5)" class="pattern-part"/>
      <path d="M310,270 Q304,263 310,257 Q316,263 310,270Z" transform="scale(1.1) translate(-30,-10)" class="pattern-part"/>
      <path d="M240,320 Q234,313 240,307 Q246,313 240,320Z" transform="scale(0.9) translate(25,35)" class="pattern-part"/>
      <path d="M290,325 Q284,318 290,312 Q296,318 290,325Z" transform="scale(0.9) translate(35,35)" class="pattern-part"/>
      <ellipse cx="256" cy="195" rx="18" ry="14" class="pattern-part"/>
    </g>

    <!-- Pattern 3: STARS (pentagram sparkles) -->
    <g class="pat-stars">
      <polygon points="210,202 213,212 224,212 215,218 219,228 210,222 201,228 205,218 196,212 207,212" class="pattern-part"/>
      <polygon points="275,195 277,203 285,203 278,208 281,216 275,211 269,216 272,208 265,203 273,203" class="pattern-part"/>
      <polygon points="188,260 190,267 197,267 191,272 194,279 188,274 182,279 185,272 179,267 186,267" class="pattern-part"/>
      <polygon points="315,258 317,265 324,265 318,270 321,277 315,272 309,277 312,270 306,265 313,265" class="pattern-part"/>
      <polygon points="240,315 242,322 249,322 243,327 246,334 240,329 234,334 237,327 231,322 238,322" class="pattern-part"/>
      <polygon points="295,320 297,327 304,327 298,332 301,339 295,334 289,339 292,332 286,327 293,327" class="pattern-part"/>
      <ellipse cx="256" cy="195" rx="18" ry="14" class="pattern-part"/>
    </g>
  </g>

  <!-- Belly -->
  <ellipse cx="256" cy="320" rx="65" ry="55" class="belly-part" opacity="0.85"/>

  <!-- Paws -->
  <ellipse cx="190" cy="395" rx="28" ry="18" class="body-shape"/>
  <ellipse cx="322" cy="395" rx="28" ry="18" class="body-shape"/>
  <circle cx="184" cy="392" r="5" class="belly-part" opacity="0.6"/>
  <circle cx="196" cy="392" r="5" class="belly-part" opacity="0.6"/>
  <circle cx="316" cy="392" r="5" class="belly-part" opacity="0.6"/>
  <circle cx="328" cy="392" r="5" class="belly-part" opacity="0.6"/>

  <!-- Face -->
  <ellipse cx="222" cy="265" rx="18" ry="22" class="eye-fill"/>
  <circle cx="216" cy="258" r="7" fill="white"/>
  <circle cx="227" cy="268" r="3" fill="white"/>
  <ellipse cx="290" cy="265" rx="18" ry="22" class="eye-fill"/>
  <circle cx="284" cy="258" r="7" fill="white"/>
  <circle cx="295" cy="268" r="3" fill="white"/>
  <ellipse cx="256" cy="290" rx="8" ry="5" class="pattern-part" opacity="0.5" fill="var(--critter-nose)"/>
  <path d="M250,296 Q256,302 262,296" fill="none" stroke="#3A3A52" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="200" cy="288" r="14" class="pattern-part" opacity="0.25"/>
  <circle cx="312" cy="288" r="14" class="pattern-part" opacity="0.25"/>
  </g>
</svg>
