<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="45%"><stop offset="0%" stop-color="#22D3EE"/><stop offset="70%" stop-color="#0891B2"/><stop offset="100%" stop-color="#0E7490"/></radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#E0F2FE"/><stop offset="100%" stop-color="#67E8F9"/></radialGradient>
    <radialGradient id="eyeShine" cx="35%" cy="30%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FAFAFA"/></radialGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/></linearGradient>
    <linearGradient id="crystalFin" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0.4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
      <style>
      .gene-tint { filter: hue-rotate(var(--gene-hue-shift, 0deg)) saturate(var(--gene-sat-mult, 1)) brightness(var(--gene-light-mult, 1)); }
    </style>  </defs>

  <g class="gene-tint">
  <!-- ═══ BODY: Teardrop shape (upside-down) ═══ -->
  <g id="body">
    <!-- Main teardrop body -->
    <path d="M100,40 Q130,80 128,130 Q126,165 100,170 Q74,165 72,130 Q70,80 100,40Z" fill="url(#bodyGrad)" stroke="#0E7490" stroke-width="1" opacity="0.9"/>
    <!-- Inner glow core (visible through translucent body) -->
    <circle cx="100" cy="110" r="22" fill="url(#coreGrad)" opacity="0.7" filter="url(#glow)"/>
    <!-- Surface highlights -->
    <path d="M84,60 Q90,80 85,120" fill="none" stroke="#FAFAFA" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <ellipse cx="90" cy="70" rx="8" ry="12" fill="#FAFAFA" opacity="0.15" transform="rotate(-15 90 70)"/>
    <!-- Eyes -->
    <ellipse cx="85" cy="95" rx="7" ry="8.5" fill="#1E1B4B"/>
    <ellipse cx="115" cy="95" rx="7" ry="8.5" fill="#1E1B4B"/>
    <circle cx="82" cy="91" r="2.5" fill="url(#eyeShine)"/>
    <circle cx="87" cy="97" r="1.2" fill="url(#eyeShine)"/>
    <circle cx="112" cy="91" r="2.5" fill="url(#eyeShine)"/>
    <circle cx="117" cy="97" r="1.2" fill="url(#eyeShine)"/>
    <!-- Tiny blush -->
    <circle cx="78" cy="100" r="6" fill="#F43F5E" opacity="0.2"/>
    <circle cx="122" cy="100" r="6" fill="#F43F5E" opacity="0.2"/>
    <!-- Mouth -->
    <path d="M96,104 Q100,108 104,104" fill="none" stroke="#1E1B4B" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- ═══ TRAIT: Core Shape (slot-core) ═══ -->
  <g id="slot-core-0"><!-- circle -->
    <circle cx="100" cy="110" r="22" fill="url(#coreGrad)" opacity="0.7" filter="url(#glow)"/>
  </g>
  <g id="slot-core-1" style="display:none"><!-- heart -->
    <path d="M100,118 Q100,104 108,108 Q116,104 116,112 Q116,120 100,128 Q84,120 84,112 Q84,104 92,108Z" fill="url(#coreGrad)" opacity="0.7" filter="url(#glow)" transform="translate(0,-4) scale(1.1)"/>
  </g>
  <g id="slot-core-2" style="display:none"><!-- star -->
    <path d="M100,92 L103,103 L114,104 L105,111 L108,122 L100,116 L92,122 L95,111 L86,104 L97,103Z" fill="url(#coreGrad)" opacity="0.7" filter="url(#glow)"/>
  </g>
  <g id="slot-core-3" style="display:none"><!-- diamond -->
    <polygon points="100,94 114,110 100,126 86,110" fill="url(#coreGrad)" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- ═══ TRAIT: Fin Style (slot-fins) ═══ -->
  <g id="slot-fins-0"><!-- simple -->
    <path d="M62,100 Q45,85 50,115 Q52,130 62,125Z" fill="url(#finGrad)" stroke="#0891B2" stroke-width="0.8" opacity="0.8"/>
    <path d="M138,100 Q155,85 150,115 Q148,130 138,125Z" fill="url(#finGrad)" stroke="#0891B2" stroke-width="0.8" opacity="0.8"/>
  </g>
  <g id="slot-fins-1" style="display:none"><!-- flowing -->
    <path d="M62,95 Q35,80 40,120 Q42,140 62,130 Q48,115 52,100Z" fill="url(#finGrad)" stroke="#0891B2" stroke-width="0.8" opacity="0.7"/>
    <path d="M138,95 Q165,80 160,120 Q158,140 138,130 Q152,115 148,100Z" fill="url(#finGrad)" stroke="#0891B2" stroke-width="0.8" opacity="0.7"/>
  </g>
  <g id="slot-fins-2" style="display:none"><!-- wing-like -->
    <path d="M62,100 Q30,75 35,110 Q38,135 62,128Z" fill="url(#finGrad)" stroke="#0891B2" stroke-width="0.8" opacity="0.8"/>
    <path d="M138,100 Q170,75 165,110 Q162,135 138,128Z" fill="url(#finGrad)" stroke="#0891B2" stroke-width="0.8" opacity="0.8"/>
  </g>
  <g id="slot-fins-3" style="display:none"><!-- crystal -->
    <polygon points="62,95 40,100 50,120 62,125" fill="url(#crystalFin)" stroke="#A78BFA" stroke-width="0.5" opacity="0.8" filter="url(#glow)"/>
    <polygon points="50,120 42,115 48,128" fill="#FAFAFA" opacity="0.4"/>
    <polygon points="138,95 160,100 150,120 138,125" fill="url(#crystalFin)" stroke="#A78BFA" stroke-width="0.5" opacity="0.8" filter="url(#glow)"/>
    <polygon points="150,120 158,115 152,128" fill="#FAFAFA" opacity="0.4"/>
  </g>

  <!-- ═══ TRAIT: Transparency (slot-clarity) ═══ -->
  <g id="slot-clarity-0"><!-- clear — already transparent via bodyGrad opacity --></g>
  <g id="slot-clarity-1" style="display:none"><!-- misty -->
    <circle cx="85" cy="70" r="15" fill="#FAFAFA" opacity="0.15"/>
    <circle cx="110" cy="90" r="12" fill="#FAFAFA" opacity="0.1"/>
  </g>
  <g id="slot-clarity-2" style="display:none"><!-- shimmer -->
    <circle cx="82" cy="68" r="3" fill="#FAFAFA" opacity="0.5"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="75" r="2.5" fill="#FAFAFA" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="130" r="2" fill="#FAFAFA" opacity="0.35"><animate attributeName="opacity" values="0.35;0.1;0.35" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g id="slot-clarity-3" style="display:none"><!-- prismatic -->
    <ellipse cx="100" cy="105" rx="28" ry="35" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.4" filter="url(#glow)"/>
    <ellipse cx="100" cy="105" rx="22" ry="28" fill="none" stroke="#F43F5E" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- ═══ RARITY OVERLAYS ═══ -->
  <g id="rare-iridescent" style="display:none">
    <ellipse cx="100" cy="105" rx="35" ry="42" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
  </g>
  <g id="legendary-aura" style="display:none">
    <circle cx="100" cy="105" r="55" fill="#06B6D4" opacity="0.08" filter="url(#softGlow)"/>
    <circle cx="75" cy="80" r="2" fill="#E0F2FE" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="125" cy="90" r="1.5" fill="#E0F2FE" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <g id="mut-shiny" style="display:none"><ellipse cx="100" cy="105" rx="38" ry="45" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/></g>
  <g id="mut-prismatic" style="display:none"><ellipse cx="100" cy="105" rx="40" ry="47" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/></g>
  <g id="mut-ethereal" style="display:none"><circle cx="100" cy="105" r="50" fill="#A78BFA" opacity="0.06" filter="url(#softGlow)"/></g>
  </g>
</svg>
