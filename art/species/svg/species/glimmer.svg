<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#DDD6FE"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="diamondGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EDE9FE"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="obeliskGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DDD6FE"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient>
    <radialGradient id="coreSolid" cx="50%" cy="50%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#A78BFA"/></radialGradient>
    <radialGradient id="coreSwirl" cx="50%" cy="50%"><stop offset="0%" stop-color="#FAFAFA"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#8B5CF6"/></radialGradient>
    <radialGradient id="coreNebula" cx="50%" cy="50%"><stop offset="0%" stop-color="#FAFAFA"/><stop offset="30%" stop-color="#F43F5E"/><stop offset="60%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#1E1B4B"/></radialGradient>
    <linearGradient id="refractClear" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAFAFA" stop-opacity="0.4"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0.1"/></linearGradient>
    <linearGradient id="refractRainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F43F5E" stop-opacity="0.5"/><stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0.5"/></linearGradient>
    <linearGradient id="refractAurora" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5"/><stop offset="50%" stop-color="#A78BFA" stop-opacity="0.4"/><stop offset="100%" stop-color="#34D399" stop-opacity="0.5"/></linearGradient>
    <linearGradient id="refractPrism" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F43F5E"/><stop offset="25%" stop-color="#F59E0B"/><stop offset="50%" stop-color="#34D399"/><stop offset="75%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
      <style>
      .gene-tint { filter: hue-rotate(var(--gene-hue-shift, 0deg)) saturate(var(--gene-sat-mult, 1)) brightness(var(--gene-light-mult, 1)); }
    </style>  </defs>

  <g class="gene-tint">
  <!-- ═══ BODY: Hexagonal crystal ═══ -->
  <g id="body">
    <!-- Crystal glow aura -->
    <polygon points="100,30 150,60 150,130 100,165 50,130 50,60" fill="#A78BFA" opacity="0.1" filter="url(#softGlow)"/>
    <!-- Main hexagon crystal -->
    <polygon points="100,35 145,62 145,128 100,158 55,128 55,62" fill="url(#hexGrad)" stroke="#7C3AED" stroke-width="1"/>
    <!-- Crystal facets (internal lines for gem look) -->
    <line x1="100" y1="35" x2="100" y2="158" stroke="#7C3AED" stroke-width="0.5" opacity="0.4"/>
    <line x1="55" y1="62" x2="145" y2="128" stroke="#7C3AED" stroke-width="0.5" opacity="0.3"/>
    <line x1="145" y1="62" x2="55" y2="128" stroke="#7C3AED" stroke-width="0.5" opacity="0.3"/>
    <!-- Eyes -->
    <ellipse cx="85" cy="88" rx="7.5" ry="9" fill="#1E1B4B"/>
    <ellipse cx="115" cy="88" rx="7.5" ry="9" fill="#1E1B4B"/>
    <circle cx="82" cy="84" r="2.5" fill="#FAFAFA"/>
    <circle cx="87" cy="90" r="1.2" fill="#FAFAFA"/>
    <circle cx="112" cy="84" r="2.5" fill="#FAFAFA"/>
    <circle cx="117" cy="90" r="1.2" fill="#FAFAFA"/>
    <!-- Mouth -->
    <path d="M96,100 Q100,104 104,100" fill="none" stroke="#1E1B4B" stroke-width="1" stroke-linecap="round"/>
    <!-- Highlight reflection -->
    <line x1="70" y1="58" x2="85" y2="45" stroke="#FAFAFA" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
    <line x1="75" y1="65" x2="90" y2="50" stroke="#FAFAFA" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  </g>

  <!-- ═══ TRAIT: Crystal Shape (slot-shape) ═══ -->
  <g id="slot-shape-0"><!-- hexagon: default body --></g>
  <g id="slot-shape-1" style="display:none"><!-- diamond -->
    <polygon points="100,35 145,62 145,128 100,158 55,128 55,62" fill="none" stroke="none"/>
    <polygon points="100,30 145,97 100,165 55,97" fill="url(#diamondGrad)" stroke="#7C3AED" stroke-width="1"/>
  </g>
  <g id="slot-shape-2" style="display:none"><!-- obelisk -->
    <polygon points="100,35 145,62 145,128 100,158 55,128 55,62" fill="none" stroke="none"/>
    <polygon points="100,20 120,60 120,140 100,170 80,140 80,60" fill="url(#obeliskGrad)" stroke="#6D28D9" stroke-width="1"/>
  </g>
  <g id="slot-shape-3" style="display:none"><!-- cluster -->
    <polygon points="100,35 145,62 145,128 100,158 55,128 55,62" fill="none" stroke="none"/>
    <polygon points="100,25 135,55 135,120 100,145 65,120 65,55" fill="url(#hexGrad)" stroke="#7C3AED" stroke-width="1"/>
    <polygon points="80,60 110,42 130,70" fill="#C4B5FD" opacity="0.6"/>
    <polygon points="120,90 150,80 148,115" fill="#A78BFA" opacity="0.5"/>
    <polygon points="70,100 50,90 55,125" fill="#C4B5FD" opacity="0.5"/>
  </g>

  <!-- ═══ TRAIT: Inner Core (slot-innercore) ═══ -->
  <g id="slot-innercore-0"><!-- solid -->
    <circle cx="100" cy="100" r="14" fill="url(#coreSolid)" opacity="0.6" filter="url(#glow)"/>
  </g>
  <g id="slot-innercore-1" style="display:none"><!-- hollow -->
    <circle cx="100" cy="100" r="14" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <circle cx="100" cy="100" r="8" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>
  </g>
  <g id="slot-innercore-2" style="display:none"><!-- swirling -->
    <path d="M90,90 Q100,80 110,90 Q120,100 110,110 Q100,120 90,110 Q80,100 90,90Z" fill="none" stroke="#FAFAFA" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
    <circle cx="100" cy="100" r="10" fill="url(#coreSwirl)" opacity="0.5"/>
  </g>
  <g id="slot-innercore-3" style="display:none"><!-- nebula -->
    <circle cx="100" cy="100" r="16" fill="url(#coreNebula)" opacity="0.55" filter="url(#glow)"/>
    <circle cx="95" cy="96" r="2" fill="#FAFAFA" opacity="0.6"/>
    <circle cx="105" cy="102" r="1.5" fill="#FAFAFA" opacity="0.5"/>
    <circle cx="98" cy="105" r="1.2" fill="#FAFAFA" opacity="0.4"/>
  </g>

  <!-- ═══ TRAIT: Refraction (slot-refraction) ═══ -->
  <g id="slot-refraction-0"><!-- clear -->
    <polygon points="65,58 100,42 135,58" fill="url(#refractClear)"/>
    <polygon points="55,62 65,58 100,42" fill="url(#refractClear)" opacity="0.5"/>
  </g>
  <g id="slot-refraction-1" style="display:none"><!-- rainbow -->
    <polygon points="60,60 100,38 140,65" fill="url(#refractRainbow)"/>
    <polygon points="100,38 140,65 145,62" fill="#A78BFA" opacity="0.2"/>
  </g>
  <g id="slot-refraction-2" style="display:none"><!-- aurora -->
    <ellipse cx="100" cy="95" rx="55" ry="40" fill="url(#refractAurora)" filter="url(#glow)" opacity="0.4"/>
  </g>
  <g id="slot-refraction-3" style="display:none"><!-- prismatic burst -->
    <polygon points="65,55 100,35 125,60" fill="url(#refractPrism)" opacity="0.5" filter="url(#glow)"/>
    <polygon points="55,62 65,55 100,35" fill="#F43F5E" opacity="0.3"/>
    <polygon points="100,35 125,60 145,62" fill="#A78BFA" opacity="0.3"/>
    <polygon points="100,35 90,60 110,60" fill="#FAFAFA" opacity="0.2"/>
  </g>

  <!-- ═══ RARITY ═══ -->
  <g id="rare-iridescent" style="display:none">
    <polygon points="100,25 155,58 155,132 100,168 45,132 45,58" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
  </g>
  <g id="legendary-aura" style="display:none">
    <circle cx="100" cy="95" r="60" fill="#A78BFA" opacity="0.06" filter="url(#softGlow)"/>
    <circle cx="70" cy="70" r="2" fill="#F59E0B" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="135" cy="80" r="1.5" fill="#FAFAFA" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <g id="mut-shiny" style="display:none"><polygon points="100,28 150,58 150,130 100,160 50,130 50,58" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/></g>
  <g id="mut-prismatic" style="display:none"><polygon points="100,28 150,58 150,130 100,160 50,130 50,58" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/></g>
  <g id="mut-ethereal" style="display:none"><circle cx="100" cy="95" r="55" fill="#A78BFA" opacity="0.06" filter="url(#softGlow)"/></g>
  </g>
</svg>
