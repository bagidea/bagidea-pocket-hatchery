<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <style>
      .label { font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #7C7A92; text-anchor: middle; }
      .egg-base { fill: #FFF6E9; stroke-width: 1.5; }
      .egg-pattern { opacity: 0.55; }
      .crack { fill: none; stroke-width: 1.2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#FFF6E9"/>
  <text x="600" y="28" text-anchor="middle" font-family="'Baloo 2',system-ui,sans-serif" font-size="18" font-weight="800" fill="#3A3A52">Pocket Hatchery — Egg Designs (12 species)</text>

  <!-- Foxling Egg -->
  <g transform="translate(55, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#8FD694" stroke="#5BB572" class="egg-base"/>
    <circle cx="22" cy="30" r="4" fill="#FFF6E9" opacity="0.6"/>
    <circle cx="38" cy="55" r="3" fill="#FFF6E9" opacity="0.6"/>
    <circle cx="28" cy="50" r="2.5" fill="#FFF6E9" opacity="0.4"/>
    <path d="M30,25 L38,45 L25,55" class="crack" stroke="#FFCB6B"/>
    <text x="35" y="102" class="label">🦊 Foxling</text>
  </g>

  <!-- Owlet Egg -->
  <g transform="translate(155, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#A8DCF0" stroke="#7EC8E0" class="egg-base"/>
    <circle cx="35" cy="40" r="15" fill="none" stroke="#FFF6E9" stroke-width="1" opacity="0.5"/>
    <circle cx="35" cy="40" r="8" fill="none" stroke="#FFF6E9" stroke-width="1" opacity="0.4"/>
    <circle cx="35" cy="40" r="3" fill="#FFCB6B" opacity="0.6"/>
    <path d="M30,22 L35,28 L40,22" class="crack" stroke="#5FB8E8"/>
    <text x="35" y="102" class="label">🦉 Owlet</text>
  </g>

  <!-- Droplet Egg -->
  <g transform="translate(255, 50)">
    <ellipse cx="35" cy="45" rx="28" ry="42" fill="#5BC0BE" stroke="#3DA5A3" class="egg-base"/>
    <path d="M15,30 Q35,20 55,30 Q35,40 15,30" fill="none" stroke="#FFF6E9" stroke-width="1" opacity="0.5"/>
    <path d="M15,45 Q35,35 55,45 Q35,55 15,45" fill="none" stroke="#FFF6E9" stroke-width="1" opacity="0.35"/>
    <path d="M30,15 L35,28 L28,35" class="crack" stroke="#F0F8FF"/>
    <text x="35" y="102" class="label">💧 Droplet</text>
  </g>

  <!-- Pebblit Egg -->
  <g transform="translate(355, 50)">
    <ellipse cx="35" cy="45" rx="28" ry="38" fill="#C49A6C" stroke="#A07848" class="egg-base"/>
    <circle cx="22" cy="35" r="3" fill="#8FD694" opacity="0.5"/>
    <circle cx="40" cy="48" r="4" fill="#8FD694" opacity="0.4"/>
    <circle cx="30" cy="55" r="2" fill="#8FD694" opacity="0.5"/>
    <path d="M28,18 L32,25 L32,18" fill="none" stroke="#5BB572" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M20,50 L30,60 L35,55" class="crack" stroke="#8FD694"/>
    <text x="35" y="102" class="label">🪨 Pebblit</text>
  </g>

  <!-- Sproutling Egg -->
  <g transform="translate(455, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#5BB572" stroke="#4A9E5E" class="egg-base"/>
    <path d="M20,25 Q25,18 30,25 Q25,30 20,25Z" fill="#FFF6E9" opacity="0.5"/>
    <path d="M35,40 Q40,33 45,40 Q40,45 35,40Z" fill="#FFF6E9" opacity="0.4"/>
    <path d="M25,55 Q35,45 45,55" fill="none" stroke="#FFF6E9" stroke-width="1" opacity="0.3"/>
    <path d="M35,15 L35,28" class="crack" stroke="#FF9EB5"/>
    <text x="35" y="102" class="label">🌱 Sproutling</text>
  </g>

  <!-- Flicker Egg -->
  <g transform="translate(555, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#1a1a2e" stroke="#3A3A52" class="egg-base"/>
    <path d="M22,20 Q28,28 25,40 Q20,48 22,60" fill="none" stroke="#FFCB6B" stroke-width="1.5" opacity="0.7"/>
    <path d="M38,18 Q42,30 40,42 Q38,50 42,58" fill="none" stroke="#FF9EB5" stroke-width="1.2" opacity="0.5"/>
    <path d="M30,22 L35,35 L28,45" class="crack" stroke="#FFCB6B"/>
    <text x="35" y="102" class="label" fill="#B7B3C2">🔥 Flicker</text>
  </g>

  <!-- Glimmer Egg -->
  <g transform="translate(655, 50)">
    <ellipse cx="35" cy="45" rx="28" ry="38" fill="#FFF6E9" stroke="#C9A8FF" class="egg-base"/>
    <polygon points="35,10 48,22 48,45 35,58 22,45 22,22" fill="none" stroke="#B07BE8" stroke-width="0.8" opacity="0.3"/>
    <polygon points="35,20 42,28 42,42 35,50 28,42 28,28" fill="none" stroke="#C9A8FF" stroke-width="0.8" opacity="0.4"/>
    <path d="M30,25 L38,35 L28,50" class="crack" stroke="#B07BE8"/>
    <text x="35" y="102" class="label">💎 Glimmer</text>
  </g>

  <!-- Wisp Egg -->
  <g transform="translate(755, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#2D1B4E" stroke="#4A2A6E" class="egg-base"/>
    <path d="M20,25 Q28,22 35,30 Q42,22 50,25 Q42,35 50,45 Q42,55 35,60 Q28,55 20,45 Q28,35 20,25Z" fill="none" stroke="#C9A8FF" stroke-width="0.8" opacity="0.35"/>
    <circle cx="25" cy="35" r="1.5" fill="#FFF" opacity="0.4"/>
    <circle cx="42" cy="28" r="1.2" fill="#FFF" opacity="0.3"/>
    <circle cx="30" cy="52" r="1.5" fill="#FFF" opacity="0.35"/>
    <path d="M35,15 L32,28 L38,25" class="crack" stroke="#C9A8FF" opacity="0.6"/>
    <text x="35" y="102" class="label" fill="#B7B3C2">👻 Wisp</text>
  </g>

  <!-- Fluffle Egg -->
  <g transform="translate(855, 50)">
    <ellipse cx="35" cy="45" rx="32" ry="42" fill="#FFF6E9" stroke="#F5E6CC" class="egg-base"/>
    <path d="M15,30 Q25,20 35,28 Q45,20 55,30" fill="none" stroke="#F5E6CC" stroke-width="1.5" opacity="0.5"/>
    <path d="M15,45 Q25,38 35,45 Q45,38 55,45" fill="none" stroke="#F5E6CC" stroke-width="1.2" opacity="0.4"/>
    <circle cx="28" cy="40" r="2" fill="#8FD694" opacity="0.3"/>
    <circle cx="42" cy="32" r="1.5" fill="#8FD694" opacity="0.25"/>
    <path d="M35,10 L35,22" class="crack" stroke="#8FD694" opacity="0.4"/>
    <text x="35" y="102" class="label">☁️ Fluffle</text>
  </g>

  <!-- Shellby Egg -->
  <g transform="translate(955, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#F5F0E8" stroke="#E8D5F0" class="egg-base"/>
    <path d="M35,20 Q22,25 20,35 Q18,48 25,58" fill="none" stroke="#C9A8FF" stroke-width="1.2" opacity="0.4"/>
    <path d="M35,20 Q48,25 50,35 Q52,48 45,58" fill="none" stroke="#C9A8FF" stroke-width="1" opacity="0.3"/>
    <path d="M35,20 Q35,35 40,45" fill="none" stroke="#FF9EB5" stroke-width="1" opacity="0.35"/>
    <path d="M32,15 L35,30 L30,40" class="crack" stroke="#E8D5F0"/>
    <text x="35" y="102" class="label">🐚 Shellby</text>
  </g>

  <!-- Dracling Egg -->
  <g transform="translate(1055, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#B07BE8" stroke="#8A4FD4" class="egg-base"/>
    <g opacity="0.4">
      <path d="M15,25 L22,22 L25,28 L32,25 L20,32Z" fill="#FFD86B"/>
      <path d="M28,40 L35,37 L40,42 L48,38 L38,48Z" fill="#FFD86B"/>
      <path d="M18,52 L22,48 L28,55 L35,50 L25,60Z" fill="#FFD86B"/>
    </g>
    <path d="M35,12 L35,28 L28,40" class="crack" stroke="#FFD86B"/>
    <text x="35" y="102" class="label">🐉 Dracling</text>
  </g>

  <!-- Buzzle Egg -->
  <g transform="translate(1155, 50)">
    <ellipse cx="35" cy="45" rx="30" ry="40" fill="#FFCB6B" stroke="#F0B830" class="egg-base"/>
    <polygon points="35,15 42,18 42,25 35,28 28,25 28,18" fill="none" stroke="#C49A6C" stroke-width="1" opacity="0.4"/>
    <polygon points="22,35 28,37 28,43 22,45 16,43 16,37" fill="none" stroke="#C49A6C" stroke-width="1" opacity="0.35"/>
    <polygon points="48,35 54,37 54,43 48,45 42,43 42,37" fill="none" stroke="#C49A6C" stroke-width="1" opacity="0.35"/>
    <path d="M35,10 L35,22 L30,30" class="crack" stroke="#C49A6C"/>
    <text x="35" y="102" class="label">🐝 Buzzle</text>
  </g>

  <!-- Second row: Fluffle, Shellby, Dracling, Buzzle -->

</svg>
